[package]
name = "modern-rust-guidance"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "mrg: search and retrieve verified modern Rust guidance, and scan a crate for legacy patterns"
license = "MIT"
publish = false

[[bin]]
name = "mrg"
path = "src/main.rs"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
